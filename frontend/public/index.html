<!doctype html>
<html lang="en">
    <head>
        <!-- boilerplate -->
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Asset Checkout</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <header>
            <!-- random logo -->
            <div class="logo-mark">
                <svg viewBox="0 0 12 12">
                    <rect x="1" y="1" width="4" height="4" />
                    <rect x="7" y="1" width="4" height="4" />
                    <rect x="1" y="7" width="4" height="4" />
                    <rect x="7" y="7" width="4" height="4" />
                </svg>
            </div>
            <h1>Asset Checkout</h1>
            <div
                style="
                    margin-left: auto;
                    display: flex;
                    align-items: center;
                    gap: 10px;
                "
            >
                <a
                    href="admin.html"
                    style="
                        font-family: var(--mono);
                        font-size: 11px;
                        font-weight: 600;
                        letter-spacing: 0.1em;
                        text-transform: uppercase;
                        text-decoration: none;
                        color: var(--muted);
                        border: 1px solid var(--border);
                        padding: 6px 14px;
                        transition:
                            color 0.15s,
                            border-color 0.15s;
                        display: flex;
                        align-items: center;
                        gap: 7px;
                    "
                    onmouseover="
                        this.style.color = 'var(--text)';
                        this.style.borderColor = 'var(--border-hover)';
                    "
                    onmouseout="
                        this.style.color = 'var(--muted)';
                        this.style.borderColor = 'var(--border)';
                    "
                >
                    <svg
                        width="11"
                        height="11"
                        viewBox="0 0 12 12"
                        fill="currentColor"
                    >
                        <rect x="1" y="1" width="4" height="4" />
                        <rect x="7" y="1" width="4" height="4" />
                        <rect x="1" y="7" width="4" height="4" />
                        <rect x="7" y="7" width="4" height="4" />
                    </svg>
                    Admin
                </a>
            </div>
        </header>
        <main>
            <p class="section-label">New Checkout</p>
            <!-- form to checkout items -->
            <form
                class="checkout-form"
                id="checkout-form"
                onsubmit="handleCheckout(event)"
            >
                <div class="field">
                    <label>Customer</label>
                    <input
                        type="text"
                        id="f-user"
                        placeholder="John Smith"
                        autocomplete="off"
                        required
                    />
                </div>
                <div class="field">
                    <label>Asset</label>
                    <input
                        type="text"
                        id="f-asset"
                        placeholder="OPS-1234"
                        autocomplete="off"
                        required
                    />
                </div>
                <div class="field">
                    <label>Location</label>
                    <input
                        type="text"
                        id="f-location"
                        placeholder="Courtroom 3"
                        autocomplete="off"
                        required
                    />
                </div>
                <button class="btn-checkout" type="submit" id="submit-btn">
                    Check Out
                </button>
            </form>
            <p class="section-label">Checked Out Assets</p>
            <!-- search bar -->
            <div class="search-wrap">
                <span class="search-icon">/</span>
                <input
                    type="text"
                    id="search"
                    placeholder="Search by name, asset, or location..."
                    oninput="filterAssets()"
                />
            </div>
            <div class="stats-bar">
                <span id="count-label">— items</span>
                <span style="color: var(--border)">|</span>
                <span style="color: var(--muted)"
                    >last refresh <span id="refresh-time">—</span></span
                >
            </div>
            <!-- asset list (currently checked out) -->
            <div id="asset-list">

                <div class="empty-state">
                    <span class="big">⊘</span>Loading assets...
                </div>
            </div>
        </main>
        <!-- displays toast message in bottom right -->
        <div id="toast"></div>
        <script src="script.js"></script>
    </body>
</html>
